pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        // Flutter writes local.properties as UTF-8; the workspace can have a Chinese name.
        file("local.properties").withReader("UTF-8") { properties.load(it) }
        // The older Flutter plugin loader uses Properties.load(InputStream), which
        // assumes Latin-1. Unicode escapes work for both loader implementations.
        file("local.properties").withOutputStream { properties.store(it, null) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()
    settings.ext.flutterSdkPath = flutterSdkPath

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // share_plus 12.x requires newer Android build tooling.
    id "com.android.application" version "8.12.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.0" apply false
}

include ":app"
